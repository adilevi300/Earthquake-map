<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        #map {
            width: 980px;
            height: 539px;
        }
        </style>
        <title></title>
    
<style id="final-popup-theme">
#popup.ol-popup {
  background:#24527A !important;
  background-color:#24527A !important;
  border:1px solid #6FA3CC !important;
  color:#fff !important;
  min-width:380px !important;
  max-width:500px !important;
  padding:16px 18px !important;
  border-radius:12px !important;
}
#popup.ol-popup:after { border-top-color:#24527A !important; }
#popup.ol-popup:before { border-top-color:#6FA3CC !important; }
#popup-content, #popup-content * { color:#fff !important; }
#popup-content { font-size:13px !important; line-height:1.35 !important; max-width:460px !important; }
#popup-content ul { margin:0 !important; padding:0 !important; }
#popup-content li { margin:0 !important; }
#popup-content table { width:100% !important; table-layout:fixed !important; border-collapse:collapse !important; }
#popup-content th, #popup-content td {
  display:table-cell !important;
  vertical-align:top !important;
  text-align:left !important;
  padding:4px 8px 4px 0 !important;
  min-width:0 !important;
}
#popup-content th { width:45% !important; font-weight:600 !important; white-space:normal !important; }
#popup-content td { width:55% !important; overflow-wrap:break-word !important; word-break:normal !important; }
#popup-content .popup-layer-title {
  display:block !important;
  font-size:16px !important;
  font-weight:700 !important;
  padding:0 0 8px 0 !important;
  margin:0 0 6px 0 !important;
  border-bottom:1px solid rgba(255,255,255,.35) !important;
}
#popup .ol-popup-closer { color:#fff !important; }
</style>

<style id="final-map-ui">
/* Slightly more compact popups */
#popup.ol-popup { min-width:330px !important; max-width:430px !important; padding:13px 15px !important; }
#popup-content { font-size:12.5px !important; line-height:1.3 !important; max-width:400px !important; }
#popup-content th, #popup-content td { padding:3px 7px 3px 0 !important; }
#popup-content .popup-layer-title { font-size:15px !important; padding-bottom:6px !important; margin-bottom:4px !important; }

/* Compact academic legend */
#map-legend { position:absolute; left:12px; bottom:12px; z-index:1000; width:168px; box-sizing:border-box; background:rgba(255,255,255,.94); color:#222; border:1px solid rgba(0,0,0,.22); border-radius:8px; padding:9px 11px; font:12px/1.25 Arial,sans-serif; box-shadow:0 1px 4px rgba(0,0,0,.22); }
.legend-title { font-weight:700; font-size:14px; margin-bottom:6px; }
.legend-subtitle { font-weight:600; font-size:11px; margin-bottom:4px; }
.legend-gap { margin-top:7px; }
.legend-row { display:flex; align-items:center; gap:7px; margin:3px 0; }
.legend-dot { width:12px; height:12px; border-radius:50%; border:1px solid #5C5C5C; display:inline-block; flex:0 0 auto; }
.legend-dot.high { background:#D32F2F; }
.legend-dot.medium { background:#F2C94C; }
.legend-dot.low { background:#70AD47; }
.legend-diamond { width:10px; height:10px; background:#24527A; border:1px solid #5C5C5C; transform:rotate(45deg); display:inline-block; margin-left:1px; flex:0 0 auto; }
.legend-sizes { height:23px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 7px; }
.mag-dot { border-radius:50%; background:#ddd; border:1px solid #666; display:inline-block; }
.mag-dot.s1 { width:6px; height:6px; }.mag-dot.s2 { width:10px; height:10px; }.mag-dot.s3 { width:14px; height:14px; }.mag-dot.s4 { width:20px; height:20px; }
.legend-size-labels { display:flex; justify-content:space-between; padding:0 4px; font-size:10px; color:#555; }
/* Make the layer selector easy to find */
.layer-switcher { top:8px !important; right:8px !important; }
.layer-switcher button { border-radius:6px !important; }
.layer-switcher .panel { max-height:260px; font:12px Arial,sans-serif; }
@media (max-width:650px) { #map-legend { width:150px; font-size:11px; } #popup.ol-popup { min-width:280px !important; max-width:360px !important; } }
</style>
</head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
            <div id="map-legend" aria-label="Map legend">
              <div class="legend-title">Legend</div>
              <div class="legend-subtitle">Impact level (circle color)</div>
              <div class="legend-row"><span class="legend-dot high"></span><span>High</span></div>
              <div class="legend-row"><span class="legend-dot medium"></span><span>Medium</span></div>
              <div class="legend-row"><span class="legend-dot low"></span><span>Low</span></div>
              <div class="legend-subtitle legend-gap">Magnitude (circle size)</div>
              <div class="legend-sizes"><span class="mag-dot s1"></span><span class="mag-dot s2"></span><span class="mag-dot s3"></span><span class="mag-dot s4"></span></div>
              <div class="legend-size-labels"><span>6.3</span><span>9.1</span></div>
              <div class="legend-row legend-gap"><span class="legend-diamond"></span><span>Contextual Factors</span></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/EarthquakeImpactWeb_1.js"></script><script src="layers/ContextualFactors_2.js"></script>
        <script src="styles/EarthquakeImpactWeb_1_style.js"></script><script src="styles/ContextualFactors_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
    </body>
</html>
